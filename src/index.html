<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Brunna Fortuna Advocacia | Direito das Famílias e Sucessões</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1a2b">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="format-detection" content="telephone=no">
  <link rel="preload" href="/fonts/cormorant-garamond-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Ativa o estado inicial das animações só com JS e sem preferência por movimento reduzido.
    // Fail-safe: se as animações não iniciarem em 4s, o conteúdo volta a aparecer.
    // A intro com o monograma roda uma vez por sessão (chave igual a INTRO_STORAGE_KEY).
    (function (d) {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var h = d.documentElement;
      h.classList.add('js-anim');
      try {
        if (!sessionStorage.getItem('bf-intro-seen')) h.classList.add('intro-pending');
      } catch (e) {}
      setTimeout(function () {
        if (!h.classList.contains('anim-ready')) h.classList.remove('js-anim', 'intro-pending');
      }, 4000);
    })(document);
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
